name: Build IPA

on:
  push:
    branches: [main, master, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# 同一個分支（含它的 PR）只保留最新一次編譯：推送分支與開 PR 幾乎同時發生時，不必重複編譯同一份程式碼
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 液態玻璃需要 iOS 26 SDK（Xcode 26），因此使用 macOS 26 runner
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -e
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen & ldid
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project GodBook.xcodeproj \
            -scheme GodBook \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee build.log | tail -n 200

      - name: Package IPA
        run: |
          set -e
          APP=$(find build/Build/Products -maxdepth 2 -name "GodBook.app" | head -1)
          test -d "$APP"
          # 以 ldid 做假簽章，讓 TrollStore / AltStore / Sideloadly 可直接安裝；失敗就讓編譯失敗，不要產出沒簽好的 IPA
          ldid -S "$APP/GodBook"
          rm -rf Payload GodBook.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry GodBook.ipa Payload
          ls -lh GodBook.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: GodBook-ipa
          path: GodBook.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GodBook.ipa
