name: GodBook
options:
  bundleIdPrefix: com.godbook
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: 2.6.0

targets:
  GodBook:
    type: application
    platform: iOS
    dependencies:
      - package: SwiftSoup
    sources:
      - path: GodBook
        excludes:
          - BundledSources
      # 內建 venera 漫畫源（腳本與 index.json）
      - path: GodBook/BundledSources
        type: folder
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godbook.app
        PRODUCT_NAME: GodBook
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: GodBook
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleLocalizations:
          - zh-Hant
          - zh-Hans
          - en
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.godbook.app
            CFBundleURLSchemes:
              - godbook
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # 部分漫畫源的圖片是 http:// 網址；venera 的網路層不受 ATS 限制，這裡也要放行
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # 允許 ProMotion（120Hz）：iPhone 上第三方 App 預設把自訂動畫與 Core Animation 限制在 60Hz
        CADisableMinimumFrameDurationOnPhone: true
        # 設為 false 才會啟用 iOS 26 的液態玻璃外觀
        UIDesignRequiresCompatibility: false
        NSPhotoLibraryUsageDescription: 選擇自訂背景圖片
        NSPhotoLibraryAddUsageDescription: 儲存漫畫圖片到相簿
        NSFaceIDUsageDescription: 解鎖 GodBook
        # 讓下載與匯出的檔案可在「檔案」App 的 GodBook 資料夾中看到
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
